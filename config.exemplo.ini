# Configurações do Robô de Cotações
# Copie este arquivo para "config.ini" e preencha com os seus dados.
# (O config.ini não deve ir para o GitHub, porque tem a sua senha.)

[email]
# sim = manda a planilha por e-mail toda vez que o robô roda
ativo = nao

# Gmail: servidor smtp.gmail.com, porta 587.
# A senha NÃO é a senha normal do Gmail: é uma "senha de app".
# Crie em: Conta Google > Segurança > Verificação em duas etapas > Senhas de app
servidor = smtp.gmail.com
porta = 587
usuario = seuemail@gmail.com
senha = cole_aqui_a_senha_de_app
destinatario = seuemail@gmail.com

# sim = só manda e-mail quando algum alerta disparar
# nao = manda e-mail sempre
somente_com_alerta = nao

[alerta_acima]
# Avisa quando a moeda passar DESTE valor. Apague a linha pra desativar.
Dólar = 6,00
Euro = 7,00

[alerta_abaixo]
# Avisa quando a moeda cair ABAIXO deste valor.
Dólar = 5,00
Bitcoin = 300.000
